<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="80%">
      <stop offset="0%"   stop-color="#0f0f14"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="50%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="top-line-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#09090b"/>
      <stop offset="20%"  stop-color="#27272a"/>
      <stop offset="50%"  stop-color="#3f3f46"/>
      <stop offset="80%"  stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <style>
    .accent-bar {
      animation: bar-glow 4s ease-in-out infinite;
    }
    @keyframes bar-glow {
      0%, 100% { opacity: 0.8; }
      50%       { opacity: 1; filter: drop-shadow(0 0 4px #6366f1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .accent-bar { animation: none; }
    }
  </style>

  <!-- Background -->
  <rect width="900" height="90" fill="url(#bg)"/>

  <!-- Subtle center radial glow -->
  <ellipse cx="450" cy="45" rx="300" ry="60" fill="url(#center-glow)" filter="url(#blur-glow)"/>

  <!-- Top border line -->
  <rect x="0" y="0" width="900" height="1" fill="url(#top-line-fade)"/>

  <!-- Center accent bar with animation -->
  <rect class="accent-bar" x="370" y="0" width="160" height="1.5" rx="0.75" fill="url(#accent)"/>

  <!-- Main text -->
  <text x="450" y="42" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="600" font-size="11" fill="#71717a" letter-spacing="3.5">
    BUILDING SCALABLE DIGITAL EXPERIENCES
  </text>

  <!-- Sub text -->
  <text x="450" y="60" text-anchor="middle"
    font-family="Menlo, Monaco, 'Courier New', monospace"
    font-size="8" fill="#3f3f46" letter-spacing="2">
    © 2026 SALAH KHALED  ·  FRONTEND ENGINEER  ·  RIYADH, SA
  </text>

  <!-- Decorative dots on either side -->
  <circle cx="280" cy="50" r="1.5" fill="#27272a"/>
  <circle cx="620" cy="50" r="1.5" fill="#27272a"/>
  <line x1="290" y1="50" x2="370" y2="50" stroke="#1d1d26" stroke-width="0.8"/>
  <line x1="530" y1="50" x2="610" y2="50" stroke="#1d1d26" stroke-width="0.8"/>

  <!-- Bottom accent bar -->
  <rect class="accent-bar" x="390" y="78" width="120" height="1" rx="0.5" fill="url(#accent)" opacity="0.5"/>
</svg>
