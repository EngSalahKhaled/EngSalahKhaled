<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f0f13"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <style>
    .footer-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 10px;
      fill: #71717a;
      letter-spacing: 3px;
    }
    .footer-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 8px;
      fill: #3f3f46;
      letter-spacing: 2px;
    }
    .accent-bar {
      fill: url(#accent-grad);
    }
  </style>
  <rect width="800" height="100" fill="url(#bg-grad)" />
  <line x1="0" y1="1" x2="800" y2="1" stroke="#1d1d26" stroke-width="0.75"/>
  
  <g transform="translate(400, 50)" text-anchor="middle">
    <text class="footer-text" x="0" y="0">BUILDING SCALABLE DIGITAL EXPERIENCES</text>
    <text class="footer-sub" x="0" y="16">© 2026 SALAH KHALED • FRONTEND ENGINEER</text>
  </g>
  
  <rect class="accent-bar" x="360" y="85" width="80" height="1.5" rx="0.75"/>
</svg>
