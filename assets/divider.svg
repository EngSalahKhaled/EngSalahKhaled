<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="100%" height="100%">
  <defs>
    <!-- Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.1" />
      <stop offset="15%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#3f3f46" />
      <stop offset="85%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.1" />
    </linearGradient>
    
    <!-- Node Glow Gradient -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="1"/>
      <stop offset="30%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .base-line {
      stroke: url(#line-grad);
      stroke-width: 1;
      stroke-linecap: round;
    }
    .pulse-glow {
      animation: travel 8s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes travel {
      0% { cx: 40px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 760px; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-glow {
        display: none;
      }
    }
  </style>
  <line class="base-line" x1="40" y1="10" x2="760" y2="10" />
  <circle class="pulse-glow" cx="40" cy="10" r="6" fill="url(#glow)"/>
  <circle class="pulse-glow" cx="40" cy="10" r="1.5" fill="#ffffff"/>
</svg>
