<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="100%">
  <defs>
    <linearGradient id="line-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#09090b"/>
      <stop offset="12%"  stop-color="#3f3f46"/>
      <stop offset="50%"  stop-color="#52525b"/>
      <stop offset="88%"  stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .scanner, .node-dot { animation: none; }
    }
    .scanner {
      animation: travel 6s cubic-bezier(0.4,0,0.6,1) infinite;
    }
    @keyframes travel {
      0%   { transform: translateX(-20px); opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { transform: translateX(860px); opacity: 0; }
    }
    .node-dot {
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { r: 3; opacity: 0.6; }
      50%       { r: 5; opacity: 1; }
    }
  </style>

  <!-- Base line -->
  <line x1="40" y1="14" x2="860" y2="14" stroke="url(#line-fade)" stroke-width="1"/>

  <!-- Tick marks -->
  <line x1="225" y1="11" x2="225" y2="17" stroke="#27272a" stroke-width="1"/>
  <line x1="450" y1="10" x2="450" y2="18" stroke="#3f3f46" stroke-width="1"/>
  <line x1="675" y1="11" x2="675" y2="17" stroke="#27272a" stroke-width="1"/>

  <!-- Center diamond -->
  <polygon points="450,8 455,14 450,20 445,14" fill="none" stroke="#3f3f46" stroke-width="0.8"/>
  <circle cx="450" cy="14" r="1.5" fill="#6366f1" opacity="0.8"/>

  <!-- Scanner group -->
  <g class="scanner">
    <!-- Glow blob -->
    <circle cy="14" r="10" fill="url(#node-glow)" filter="url(#glow)"/>
    <!-- Core dot -->
    <circle cy="14" r="2" fill="#ffffff" opacity="0.95"/>
    <!-- Trail -->
    <line x1="-18" y1="14" x2="0" y2="14" stroke="url(#node-glow)" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- End node dots -->
  <circle cx="40"  cy="14" r="2.5" fill="#27272a" class="node-dot"/>
  <circle cx="860" cy="14" r="2.5" fill="#27272a" class="node-dot"/>
</svg>
