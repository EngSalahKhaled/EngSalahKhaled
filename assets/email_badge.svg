<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32" width="120" height="32">
  <defs>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f15"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <style>
    .btn-bg {
      fill: url(#btn-grad);
      stroke: #27272a;
      stroke-width: 1;
      rx: 6px;
    }
    .btn-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #e4e4e7;
      letter-spacing: 0.5px;
    }
    .btn-icon {
      fill: none;
      stroke: #a1a1aa;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
  <rect class="btn-bg" width="120" height="32" />
  <!-- Mail Icon -->
  <g transform="translate(14, 8)">
    <rect class="btn-icon" x="0" y="1" width="16" height="12" rx="2" />
    <path class="btn-icon" d="M0 3 L8 8.5 L16 3" />
  </g>
  <text class="btn-text" x="38" y="20">Contact</text>
</svg>
