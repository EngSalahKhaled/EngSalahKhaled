<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f0f15"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <!-- Glowing Blob Gradient -->
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d1d26" stroke-width="0.75"/>
    </pattern>

    <!-- Radial Mask for Grid (fades out at edges) -->
    <radialGradient id="grid-mask" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    
    <mask id="mask">
      <rect width="800" height="260" fill="url(#grid-mask)"/>
    </mask>

    <filter id="blur">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>

  <style>
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 36px;
      fill: #f4f4f5;
      letter-spacing: 7px;
    }
    .text-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: url(#accent-grad);
      letter-spacing: 5px;
    }
    .text-status {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 9px;
      fill: #a1a1aa;
      letter-spacing: 1.5px;
    }
    .text-coord {
      font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
      font-size: 8px;
      fill: #3f3f46;
      letter-spacing: 1px;
    }
    .line-draw {
      stroke: url(#accent-grad);
      stroke-width: 1;
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: draw 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .pulse-dot {
      fill: #14b8a6;
      animation: pulse 2.5s infinite ease-in-out;
    }
    .glow-blob {
      transform-origin: center;
      animation: drift 12s infinite alternate ease-in-out;
    }
    .corner-mark {
      stroke: #27272a;
      stroke-width: 1;
    }
    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    @keyframes pulse {
      0%, 100% {
        r: 3px;
        opacity: 0.5;
        fill: #14b8a6;
      }
      50% {
        r: 5px;
        opacity: 1;
        fill: #6366f1;
        filter: drop-shadow(0 0 3px #6366f1);
      }
    }
    @keyframes drift {
      0% {
        transform: translate(-30px, -15px) scale(0.9);
      }
      100% {
        transform: translate(30px, 15px) scale(1.1);
      }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .line-draw {
        stroke-dashoffset: 0;
        animation: none;
      }
      .pulse-dot {
        animation: none;
        r: 4px;
      }
      .glow-blob {
        animation: none;
      }
    }
  </style>

  <!-- Background -->
  <rect width="800" height="260" fill="url(#bg-grad)" />

  <!-- Animated Glowing Background Blobs -->
  <circle class="glow-blob" cx="400" cy="130" r="110" fill="url(#glow-grad)" filter="url(#blur)" />

  <!-- Grid Overlay (Faded out at edges using mask) -->
  <rect width="800" height="260" fill="url(#grid)" mask="url(#mask)" />

  <!-- Borders -->
  <line class="line-draw" x1="0" y1="1" x2="800" y2="1" />
  <line class="line-draw" x1="0" y1="259" x2="800" y2="259" />

  <!-- Corner Crosshairs -->
  <path class="corner-mark" d="M 15 15 L 25 15 M 20 10 L 20 20" />
  <path class="corner-mark" d="M 775 15 L 785 15 M 780 10 L 780 20" />
  <path class="corner-mark" d="M 15 245 L 25 245 M 20 240 L 20 250" />
  <path class="corner-mark" d="M 775 245 L 785 245 M 780 240 L 780 250" />

  <!-- Riyadh Location Coordinate in Bottom Left -->
  <text class="text-coord" x="35" y="235">LOC // 24°42'N 46°40'E</text>
  <text class="text-coord" x="705" y="235">SYS // v1.0.2</text>

  <!-- Status Badge Top Right -->
  <g transform="translate(630, 38)">
    <circle class="pulse-dot" cx="0" cy="-3" r="3.5" />
    <text class="text-status" x="12" y="1">OPEN FOR ROLES</text>
  </g>

  <!-- Center Typography -->
  <g transform="translate(400, 125)" text-anchor="middle">
    <!-- Main Name -->
    <text class="text-title" x="0" y="0">SALAH KHALED</text>
    <!-- Subtitle / Title -->
    <text class="text-subtitle" x="0" y="32">FRONTEND ENGINEER</text>
  </g>
</svg>
