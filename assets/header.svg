<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>

    <!-- ─── BACKGROUNDS ─── -->
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%"   stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>

    <!-- Central glow blob -->
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="60%"  stop-color="#6366f1" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Right glow blob -->
    <radialGradient id="glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#14b8a6" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>

    <!-- ─── GRADIENTS ─── -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="50%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <linearGradient id="accent-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f4f4f5"/>
      <stop offset="60%"  stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <!-- Fade-out masks for grid and borders -->
    <radialGradient id="grid-mask-rg" cx="50%" cy="50%" r="58%">
      <stop offset="0%"   stop-color="white"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-mask">
      <rect width="900" height="320" fill="url(#grid-mask-rg)"/>
    </mask>
    <linearGradient id="border-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="20%"  stop-color="white" stop-opacity="1"/>
      <stop offset="80%"  stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="border-mask">
      <rect width="900" height="1" fill="url(#border-fade)"/>
    </mask>
    <mask id="border-mask-b">
      <rect y="319" width="900" height="1" fill="url(#border-fade)"/>
    </mask>

    <!-- Blur filter -->
    <filter id="blur-strong">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur-soft">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glow-text">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- ─── GRID PATTERN ─── -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1d1d26" stroke-width="0.6"/>
    </pattern>
    <pattern id="dot-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="0.8" fill="#27272a"/>
    </pattern>

    <!-- Scan-line animation for shimmer effect -->
    <linearGradient id="shimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%"  stop-color="white" stop-opacity="0"/>
      <stop offset="45%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-2 0" to="4 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>

  </defs>

  <!-- ╔══════════════════════════════════════════╗ -->
  <!-- ║              LAYER STACK                  ║ -->
  <!-- ╚══════════════════════════════════════════╝ -->

  <!-- L1: Base background -->
  <rect width="900" height="320" fill="url(#bg)"/>

  <!-- L2: Dot-grid texture -->
  <rect width="900" height="320" fill="url(#dot-grid)" opacity="0.6"/>

  <!-- L3: Glowing blobs -->
  <ellipse cx="450" cy="160" rx="320" ry="180" fill="url(#glow-c)" filter="url(#blur-strong)">
    <animateTransform attributeName="transform" type="scale"
      values="1;1.08;1" keyTimes="0;0.5;1" dur="9s" repeatCount="indefinite"
      additive="sum" transformOrigin="450 160"/>
  </ellipse>
  <ellipse cx="750" cy="90" rx="180" ry="120" fill="url(#glow-r)" filter="url(#blur-strong)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0;25,-15;0,0" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="140" cy="240" rx="160" ry="110" fill="url(#glow-c)" filter="url(#blur-strong)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate"
      values="0,0;-20,20;0,0" dur="14s" repeatCount="indefinite"/>
  </ellipse>

  <!-- L4: Line grid overlay (masked) -->
  <rect width="900" height="320" fill="url(#grid)" mask="url(#grid-mask)" opacity="0.8"/>

  <!-- L5: Shimmer overlay -->
  <rect width="900" height="320" fill="url(#shimmer)"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- TOP + BOTTOM ANIMATED BORDER LINES          -->
  <!-- ─────────────────────────────────────────── -->

  <!-- Static base lines -->
  <rect x="0" y="0"   width="900" height="1"   fill="#1d1d26"/>
  <rect x="0" y="319" width="900" height="1"   fill="#1d1d26"/>

  <!-- Animated gradient sweep on top border -->
  <rect y="0" height="1" width="900" mask="url(#border-mask)">
    <animate attributeName="fill" values="#6366f1;#a855f7;#14b8a6;#6366f1"
      dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect y="319" height="1" width="900" mask="url(#border-mask-b)">
    <animate attributeName="fill" values="#14b8a6;#6366f1;#a855f7;#14b8a6"
      dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- ─────────────────────────────────────────── -->
  <!-- CORNER DECORATIONS                          -->
  <!-- ─────────────────────────────────────────── -->

  <!-- Top-left corner bracket -->
  <g stroke="url(#accent-v)" stroke-width="1.2" fill="none" opacity="0.7">
    <line x1="28" y1="28" x2="52" y2="28"/>
    <line x1="28" y1="28" x2="28" y2="52"/>
  </g>
  <!-- Top-right -->
  <g stroke="url(#accent-v)" stroke-width="1.2" fill="none" opacity="0.7">
    <line x1="872" y1="28" x2="848" y2="28"/>
    <line x1="872" y1="28" x2="872" y2="52"/>
  </g>
  <!-- Bottom-left -->
  <g stroke="url(#accent-v)" stroke-width="1.2" fill="none" opacity="0.7">
    <line x1="28" y1="292" x2="52" y2="292"/>
    <line x1="28" y1="292" x2="28" y2="268"/>
  </g>
  <!-- Bottom-right -->
  <g stroke="url(#accent-v)" stroke-width="1.2" fill="none" opacity="0.7">
    <line x1="872" y1="292" x2="848" y2="292"/>
    <line x1="872" y1="292" x2="872" y2="268"/>
  </g>

  <!-- Corner dots -->
  <circle cx="28"  cy="28"  r="2" fill="#6366f1" opacity="0.9"/>
  <circle cx="872" cy="28"  r="2" fill="#6366f1" opacity="0.9"/>
  <circle cx="28"  cy="292" r="2" fill="#14b8a6" opacity="0.9"/>
  <circle cx="872" cy="292" r="2" fill="#14b8a6" opacity="0.9"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- VERTICAL SIDE ACCENT LINES                  -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="0" y="0" width="2" height="320">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="898" y="0" width="2" height="320">
    <animate attributeName="opacity" values="0.4;0.15;0.4" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="2" height="320" fill="url(#accent-v)" opacity="0.5"/>
  <rect x="898" y="0" width="2" height="320" fill="url(#accent-v)" opacity="0.5"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- FLOATING PARTICLE DOTS                      -->
  <!-- ─────────────────────────────────────────── -->

  <circle cx="110" cy="80" r="1.5" fill="#6366f1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;3,-5;0,0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="240" r="1.5" fill="#14b8a6" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" begin="1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-4,6;0,0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="60" r="1" fill="#a855f7" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="260" r="1" fill="#a855f7" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="290" r="1.2" fill="#6366f1" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0;5,-3;0,0" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="50" r="1.2" fill="#14b8a6" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0;-3,4;0,0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ─────────────────────────────────────────── -->
  <!-- META LABELS (top-left / top-right)          -->
  <!-- ─────────────────────────────────────────── -->

  <!-- Top-left: Version tag -->
  <text x="44" y="24"
    font-family="Menlo, Monaco, 'Courier New', monospace"
    font-size="7.5" fill="#3f3f46" letter-spacing="1.2">v2026.07 · FRONTEND ENGINEER</text>

  <!-- Top-right: Location tag -->
  <text x="856" y="24" text-anchor="end"
    font-family="Menlo, Monaco, 'Courier New', monospace"
    font-size="7.5" fill="#3f3f46" letter-spacing="1.2">LOC 24°N · RIYADH, SA</text>

  <!-- Bottom-left: Open for roles tag -->
  <g transform="translate(44, 302)">
    <circle r="3" cx="0" cy="-2" fill="#14b8a6">
      <animate attributeName="r" values="3;4.5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="2"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="8" font-weight="600" fill="#71717a" letter-spacing="1.5">OPEN FOR COLLABORATION</text>
  </g>

  <!-- Bottom-right: Tech hint -->
  <text x="856" y="303" text-anchor="end"
    font-family="Menlo, Monaco, 'Courier New', monospace"
    font-size="7.5" fill="#3f3f46" letter-spacing="1.2">HTML · CSS · JS · REACT · NEXT</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- CENTER: MAIN TYPOGRAPHY                     -->
  <!-- ─────────────────────────────────────────── -->

  <!-- Glow behind name -->
  <text x="450" y="152" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="900" font-size="52" fill="#6366f1" opacity="0.12"
    filter="url(#blur-soft)">SALAH KHALED</text>

  <!-- Name text with gradient -->
  <text x="450" y="152" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800" font-size="52" letter-spacing="10" fill="url(#text-grad)"
    filter="url(#glow-text)">SALAH KHALED</text>

  <!-- Accent underline bar -->
  <rect x="310" y="162" width="280" height="1.5" rx="1" fill="url(#accent)">
    <animate attributeName="width" values="0;280;280" keyTimes="0;0.4;1" dur="2s" fill="freeze"/>
    <animate attributeName="x" values="450;310;310" keyTimes="0;0.4;1" dur="2s" fill="freeze"/>
  </rect>

  <!-- Subtitle -->
  <text x="450" y="192" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="500" font-size="12" letter-spacing="5" fill="url(#accent)">FRONT-END DEVELOPER</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- HORIZONTAL CENTER DECORATIVE LINES          -->
  <!-- ─────────────────────────────────────────── -->

  <!-- Left line -->
  <line x1="80" y1="160" x2="280" y2="160" stroke="url(#accent)" stroke-width="0.5" opacity="0.3">
    <animate attributeName="opacity" values="0;0.3;0" dur="5s" repeatCount="indefinite"/>
  </line>
  <!-- Right line -->
  <line x1="620" y1="160" x2="820" y2="160" stroke="url(#accent)" stroke-width="0.5" opacity="0.3">
    <animate attributeName="opacity" values="0;0.3;0" dur="5s" begin="0.5s" repeatCount="indefinite"/>
  </line>

  <!-- Left dot on line -->
  <circle cx="280" cy="160" r="2" fill="#6366f1" opacity="0.5"/>
  <!-- Right dot -->
  <circle cx="620" cy="160" r="2" fill="#14b8a6" opacity="0.5"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- BOTTOM: SHORT BIO TAG                       -->
  <!-- ─────────────────────────────────────────── -->
  <text x="450" y="225" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="400" font-size="10.5" fill="#52525b" letter-spacing="1">
    Crafting premium, high-performance web experiences · Riyadh, Saudi Arabia
  </text>

  <!-- ─── REDUCED MOTION OVERRIDE ─────────────── -->
  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { display: none; }
    }
  </style>

</svg>
